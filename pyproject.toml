[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-browser-control-plane"
version = "0.1.0"
description = "Thin control plane around official TypeSafe Jev and open-source browser runtimes."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["typesafe-sdk==0.7.1"]

[project.optional-dependencies]
browser = ["browser-harness==0.1.13"]
dev = ["pytest>=9,<10"]

[project.scripts]
jevctl = "jev_control_plane.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
