name: Deploy Zen Gateway Worker

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "문법/테스트만 검증 (배포 안 함)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: mobile-work-production
    defaults:
      run:
        working-directory: zen-worker
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Worker 문법 검증
        run: node --check src/worker.mjs && node --check src/logic.mjs

      - name: Worker 테스트
        run: node --test test/worker.test.mjs

      - name: Cloudflare Workers 배포
        if: ${{ inputs.dry_run != true }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml
