name: Mobile Work environment fixture
run-name: 'mobile-work:${{ inputs.request_id || github.run_id }}'
on:
  push:
    branches: [feat/mobile-work-gateway]
    paths:
      - mobile-work-gateway/scripts/**
      - .github/workflows/mobile-work-environment.yml
  workflow_dispatch:
    inputs:
      request_id:
        description: Gateway reservation UUID
        required: true
        type: string
      task_type:
        description: Allowlisted task type
        required: false
        default: environment_check
        type: choice
        options: [environment_check, gateway_tests, browser_check]
      target_url:
        description: Public HTTPS URL for browser_check
        required: false
        default: ''
        type: string
permissions:
  contents: read
jobs:
  environment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: inputs.task_type == 'gateway_tests'
        with:
          node-version: '24'
      - name: Install browser runtime
        if: inputs.task_type == 'browser_check'
        run: python3 -m pip install --quiet playwright==1.55.0 && python3 -m playwright install --with-deps chromium
      - name: Run allowlisted task
        env:
          MWG_TASK_TYPE: ${{ inputs.task_type || 'environment_check' }}
          MWG_TARGET_URL: ${{ inputs.target_url }}
        run: python3 mobile-work-gateway/scripts/run_task.py
      - name: Ensure result even after dependency/setup failures
        if: always()
        env:
          MWG_TASK_TYPE: ${{ inputs.task_type || 'environment_check' }}
        run: python3 mobile-work-gateway/scripts/ensure_result.py
      - name: Upload public results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mobile-work-environment-results
          path: mobile-work-results/
          if-no-files-found: error
          retention-days: 3
      - name: Deliver owner-bound result
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          MWG_RESULT_ENDPOINT: ${{ vars.MWG_RESULT_ENDPOINT }}
          MWG_REQUEST_ID: ${{ inputs.request_id }}
        run: python3 mobile-work-gateway/scripts/send_result.py
