name: Mobile Work Gateway CI
on:
  push:
    branches: [feat/mobile-work-gateway, main]
    paths: ['mobile-work-gateway/**', '.github/workflows/mobile-work-*.yml']
  pull_request:
    paths: ['mobile-work-gateway/**', '.github/workflows/mobile-work-*.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile-work-gateway/gateway
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Unit-test browser URL egress policy
        working-directory: .
        run: python3 -m unittest discover -s mobile-work-gateway/scripts -p 'test_*.py' -v
  browser-egress-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install Playwright on ephemeral cloud runner
        run: python3 -m pip install --quiet playwright==1.55.0 && python3 -m playwright install --with-deps chromium
      - name: Test real public browser through fail-closed navigation
        env:
          MWG_TASK_TYPE: browser_check
          MWG_TARGET_URL: https://example.com/
        run: |
          python3 mobile-work-gateway/scripts/run_task.py
          python3 -c "import json; r=json.load(open('mobile-work-results/result.json')); assert r['test_passed'] and r['http_status']==200 and r['page_title']=='Example Domain',r"
