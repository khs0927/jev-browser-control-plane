name: Deploy Mobile Work Gateway
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: mobile-work-production
    defaults:
      run:
        working-directory: mobile-work-gateway/gateway
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Generate provisioned bindings
        env:
          D1_ID: ${{ vars.MWG_D1_ID }}
          KV_ID: ${{ vars.MWG_OAUTH_KV_ID }}
          PUBLIC_URL: ${{ vars.MWG_PUBLIC_URL }}
          REVIEWED_SHA: ${{ vars.MWG_REVIEWED_SHA }}
        run: node ../scripts/deploy-config.mjs
      - name: Apply schema and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 migrations apply mobile-work-gateway --remote --config wrangler.deploy.json
          npx wrangler deploy --config wrangler.deploy.json
