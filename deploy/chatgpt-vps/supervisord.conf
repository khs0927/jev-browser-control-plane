[supervisord]
nodaemon=true
logfile=/home/runner/state/logs/supervisor.log
pidfile=/home/runner/state/supervisor.pid
childlogdir=/home/runner/state/logs

[program:display]
command=/usr/bin/Xvfb :99 -screen 0 1440x1000x24 -nolisten tcp
priority=1
autorestart=true

[program:chatcmd]
command=/usr/local/bin/chatcmd
priority=10
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/home/runner/state/logs/chatcmd-out.log
stderr_logfile=/home/runner/state/logs/chatcmd-err.log

[program:desktop]
command=/usr/bin/fluxbox
priority=20
autorestart=true

[program:vnc]
command=/usr/bin/x11vnc -display :99 -rfbauth /home/runner/state/vnc.pass -localhost -forever -shared -rfbport 5900
priority=20
autorestart=true

[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc 0.0.0.0:6080 127.0.0.1:5900
priority=25
autorestart=true

[program:browser]
command=/usr/local/bin/browser.sh
priority=30
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/home/runner/state/logs/browser-out.log
stderr_logfile=/home/runner/state/logs/browser-err.log
